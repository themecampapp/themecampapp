name: DCO

# Every commit in a pull request carries a Developer Certificate of Origin sign-off
# (CONTRIBUTING.md, "Sign off your commits"; decision D2). Merge commits and bots' commits
# (Dependabot's) are left out. A workflow rather than a GitHub app, so it needs nothing installed
# and works the same in forks.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an' "$c")
            case "$author" in *"[bot]") continue ;; esac
            if ! git log -1 --format='%B' "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::${c::12} by ${author} has no Signed-off-by line: $(git log -1 --format='%s' "$c")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Add the sign-off to every commit on the branch, then force-push it:"
            echo "  git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "Every commit is signed off."
