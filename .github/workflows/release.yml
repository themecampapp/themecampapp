name: Release

# Pushing a version tag (v1.2.0) publishes its GitHub release, with that version's section of
# CHANGELOG.md as the notes (open-source plan 6.2). The tag must match package.json's version.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but package.json says ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Take this version's notes from CHANGELOG.md
        run: |
          set -euo pipefail
          npx tsx scripts/changelog-section.ts "$VERSION" > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
