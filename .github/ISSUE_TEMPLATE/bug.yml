name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't file it here: see SECURITY.md to report it privately.
        Please leave out real people's names, emails and other personal details.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Sign in as a Lead
        2. Go to People → …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The hosted service (themecamp.app), a self-hosted instance (which version?), or a local checkout (which commit?).
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, Chrome on Windows…
